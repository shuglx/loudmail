[package]
name = "loudmail"
version = "0.1.0"
license = "MIT"
description = "邮件到达报警音提醒工具"
authors = ["ryan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# window-start-dragging: 无边框窗口靠 data-tauri-drag-region 拖动
# dialog: 原生文件选择（上传语音）
# system-tray: 常驻托盘（显示主窗口 / 停止报警 / 退出）
tauri = { version = "1.8", features = [
  "macos-private-api",
  "window-start-dragging",
  "shell-open",
  "dialog-open",
  "dialog-save",
  "system-tray",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }
once_cell = "1.18"
# 本机 MCP 是纯 HTTP，不需要 TLS 后端
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json"] }
rodio = "0.17"
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
auto-launch = "0.5"
dirs = "5.0"
# 用系统默认程序打开数据文件 / 目录 / 链接
open = "3.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
