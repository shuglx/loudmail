[package]
name = "loudmail"
version = "1.4.0"
license = "MIT"
description = "邮件到达报警音提醒工具"
authors = ["ryan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# window-start-dragging: 无边框窗口靠 data-tauri-drag-region 拖动
# dialog: 原生文件选择（上传语音）
# system-tray: 常驻托盘（显示主窗口 / 停止报警 / 退出）
tauri = { version = "1.8", features = [ "window-maximize", "window-unmaximize",
  "macos-private-api",
  "window-start-dragging",
  "shell-open",
  "dialog-open",
  "dialog-save",
  "system-tray",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4"] }
once_cell = "1.18"
# 本机 MCP 是纯 HTTP，不需要 TLS 后端
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json"] }
rodio = "0.17"
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
auto-launch = "0.5"
dirs = "5.0"
# 用系统默认程序打开数据文件 / 目录 / 链接
open = "3.2"
# 在线 TTS（微软 Edge Read Aloud 接口）
edge-tts-rust = "0.1"
# 内网 TTS（vLLM-Omni Speech API，WebSocket + PCM）
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
base64 = "0.22"
# 编译期嵌入 alert-sound 目录，目录内音频自动成为内置铃声
include_dir = "0.7"

# X11 底层能力：按 EWMH 强制前置并聚焦主窗口（见 src/x11.rs，做法同 kylinpaste）
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# 直接操作 GTK 窗口：隐藏 tao 预分配的空菜单栏（见 main.rs hide_empty_gtk_menubar）。
# 版本必须与 tao 0.16 的 gtk-rs 一致，否则类型不通
gtk = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
